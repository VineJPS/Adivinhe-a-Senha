<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adivinhe a senha</title>
    <link rel="stylesheet" href="css/neoStyle.css">
</head>
<body>
        <div class="container">
            <header>
                <h1>Adivinhe a Senha</h1>
            </header>
            
            <main>
                <h1>Tentativas</h1>
                <div class="respostas">
                    <div class="row">
                        <div class="col">Nº</div>
                        <div class="col">Numero Inserido</div>
                        <div class="col">Lugar Certo</div>
                        <div class="col">Lugar Errado</div>
                    </div>  
                </div>
                <div class="inserirRespostas">
                    <div class="row">
                        <input id="N1" name="N1" type="text">
                        <input id="N2" name="N2" type="text">
                        <input id="N3" name="N3" type="text">
                        <input id="N4" name="N4" type="text">
                    </div>
                    <div class="row">
                       <input type="button" value="Enviar" id="btnEnviar">
                       <input type="button" value="Desistir" id="btnDesistir">
                    </div>
                </div>
            </main>
        </div>
        
</body>
</html>
